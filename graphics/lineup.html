<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1198px; height:880px; overflow:hidden; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }

  .pitch {
    position:relative;
    width:1198px;
    height:880px;
    background: url('pitch_grass.jpeg') center/cover no-repeat;
  }

  .pitch::after {
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.22) 100%);
    pointer-events:none;
  }

  .player {
    position:absolute;
    transform: translate(-50%, -50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:2;
  }

  .photo-ring {
    width:187px;
    height:165px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .photo-inner {
    width:100%;
    height:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .photo-inner img {
    width:100%;
    height:auto;
    display:block;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }

  .jersey-wrap {
    width:56%;
    height:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
  }

  .jersey-wrap svg { width:100%; height:auto; max-height:80%; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }

  .name-tag {
    margin-top:9px;
    background:#003580;
    color:#ffffff;
    font-weight:800;
    font-size:20px;
    letter-spacing:0.3px;
    padding:5px 14px;
    border-radius:5px;
    white-space:nowrap;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    text-transform:uppercase;
  }

  .name-tag .cap {
    color:#ffd400;
    margin-left:4px;
  }

  .badge {
    position:absolute;
    top:26px;
    left:28px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:3;
  }

  .badge img { height:56px; }

  .badge-text {
    color:#ffffff;
    font-weight:800;
    font-size:22px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    line-height:1.15;
  }

  .badge-text small {
    display:block;
    font-weight:600;
    font-size:14px;
    opacity:0.9;
  }

  .formation-tag {
    position:absolute;
    top:26px;
    right:32px;
    color:#ffffff;
    font-weight:800;
    font-size:20px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    z-index:3;
    background: rgba(204,0,0,0.85);
    padding:6px 16px;
    border-radius:5px;
  }
</style>
</head>
