<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 580" width="100%" height="100%">
  <defs>
    <!-- Lawn Pattern (Alternating Light/Dark Green Stripes) -->
    <pattern id="lawn" width="80" height="580" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="580" fill="#388e3c" />
      <rect x="40" y="0" width="40" height="580" fill="#2e7d32" />
    </pattern>

    <!-- Goal Net Pattern -->
    <pattern id="net" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" />
      <path d="M 0,0 L 8,0 L 8,8 L 0,8 Z" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <!-- Goal Shadow -->
    <filter id="goal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Pitch Surface -->
  <rect width="740" height="580" fill="url(#lawn)" />

  <!-- Field Markings (Scale: 1 meter = 6 pixels) -->
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linejoin="miter" stroke-linecap="square">

    <!-- Outer Touchlines, Halfway Line (Top), and Goal Line (Bottom) -->
    <rect x="50" y="50" width="640" height="480" />

    <!-- Center Circle & Center Spot -->
    <path d="M 315,50 A 55,55 0 0,0 425,50" />
    <circle cx="370" cy="50" r="3" fill="#ffffff" />

    <!-- Penalty Area / 18-Yard Box (40.32m x 16.5m) -->
    <rect x="249" y="431" width="242" height="99" />

    <!-- Penalty Arc & Penalty Spot (11m from Goal Line) -->
    <path d="M 326,431 A 55,55 0 0,1 414,431" />
    <circle cx="370" cy="464" r="3" fill="#ffffff" />

    <!-- Goal Area / 6-Yard Box (18.32m x 5.5m) -->
    <rect x="315" y="497" width="110" height="33" />

    <!-- Corner Arcs (1m Radius) -->
    <path d="M 50,524 A 6,6 0 0,0 56,530" />
    <path d="M 684,530 A 6,6 0 0,0 690,524" />
  </g>

  <!-- Goal Structure (Placed directly behind the Goal Line) -->
  <g filter="url(#goal-shadow)">
    <!-- Net Mesh -->
    <rect x="348" y="530" width="44" height="12" fill="url(#net)" />
    <rect x="348" y="530" width="44" height="12" fill="rgba(255,255,255,0.05)" />

    <!-- Frame Supports -->
    <rect x="348" y="530" width="44" height="12" fill="none" stroke="#cccccc" stroke-width="1.5" />

    <!-- Crossbar / Posts -->
    <line x1="346" y1="530" x2="394" y2="530" stroke="#ffffff" stroke-width="5" stroke-linecap="square" />
    <circle cx="348" cy="530" r="2.5" fill="#ffffff" />
    <circle cx="392" cy="530" r="2.5" fill="#ffffff" />
  </g>
</svg>
